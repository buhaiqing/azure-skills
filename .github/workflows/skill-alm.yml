name: Skill ALM

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  validate-heal-policies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate self-healing policies
        run: python3 scripts/self_healing/validate.py

  mock-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run mock L4 scenarios
        run: python3 scripts/run_all_scenarios.py
      - name: Collect metrics
        run: python3 scripts/metrics_collector.py
      - name: Live canary mock
        run: python3 scripts/live_canary.py --env=mock
      - name: MS L400 unit tests
        run: python3 -m pytest tests/test_ms_l400.py tests/test_auto_feedback_loop.py -q

  governance-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No literal secrets in skills
        run: |
          set -euo pipefail
          if grep -RInE 'ClientSecret=[A-Za-z0-9+/=]{16,}|AccountKey=[A-Za-z0-9+/=]{20,}' \
               --include='*.md' --include='*.yaml' --include='*.yml' --include='*.json' \
               azure-*-ops 2>/dev/null; then
            echo "Possible secret literal found"
            exit 1
          fi
          echo "Secret scan OK"
      - name: Placeholder convention spot-check
        run: |
          if grep -RInE 'client_secret:\s*[A-Za-z0-9]{20,}' azure-*-ops/assets 2>/dev/null; then
            echo "Rendered secret in assets"
            exit 1
          fi
          echo "Placeholder scan OK"

  live-canary-gate:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Azure credentials
        run: |
          if [[ -z "${{ secrets.AZURE_RESOURCE_GROUP }}" ]]; then
            echo "AZURE_RESOURCE_GROUP not set, skipping live canary"
            exit 0
          fi
          echo "Azure credentials found, running live canary..."
      - name: Run live canary
        if: ${{ secrets.AZURE_RESOURCE_GROUP != '' }}
        env:
          AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_STORAGE_ACCOUNT: ${{ secrets.AZURE_STORAGE_ACCOUNT }}
        run: python3 scripts/live_canary.py --env=live
      - name: Verify pass rate
        if: ${{ secrets.AZURE_RESOURCE_GROUP != '' }}
        run: |
          json_report=$(ls -t benchmark/l4-live-canary-*.json 2>/dev/null | head -1)
          if [[ -z "$json_report" ]]; then
            echo "No live canary JSON report found"
            exit 1
          export json_report
          python3 - <<'EOF'
          import json, sys, os
          report = os.environ.get('json_report', '')
          with open(report) as f:
              data = json.load(f)
          passed = data.get('passed', 0)
          total = data.get('total', 0)
          print(f"Live canary: {passed}/{total} passed")
          if total == 0:
              print("ERROR: total=0")
              sys.exit(1)
          percent = passed * 100 // total
          print(f"Pass rate: {percent}%")
          if percent < 80:
              print(f"FAIL: pass rate {percent}% < 80%")
              sys.exit(1)
          print(f"PASS: pass rate {percent}% >= 80%")
          EOF
